<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#FAFAFA" />
    <meta
      name="description"
      content="Classroom OS — a single operating surface for timetables, homework, duty rosters and class announcements."
    />
    <!--
      Applies the persisted theme (and language) before the first paint so the
      app never flashes the wrong palette. The storage keys must stay in sync
      with `THEME_STORAGE_KEY` / `LANGUAGE_STORAGE_KEY` in src/utils/constants.js.
    -->
    <script>
      (function () {
        try {
          var root = document.documentElement
          var stored = window.localStorage.getItem('classroom-os::theme')
          var dark = stored
            ? stored === 'dark'
            : window.matchMedia('(prefers-color-scheme: dark)').matches
          root.classList.toggle('dark', dark)
          root.style.colorScheme = dark ? 'dark' : 'light'
          var themeColor = document.querySelector('meta[name="theme-color"]')
          if (themeColor) themeColor.setAttribute('content', dark ? '#0f172a' : '#FAFAFA')
          var lang = window.localStorage.getItem('classroom-os::language')
          if (lang) root.lang = lang
        } catch (error) {
          /* storage unavailable — the default light palette is a safe fallback */
        }
      })()
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <title>Classroom OS</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
